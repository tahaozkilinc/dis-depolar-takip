  <line x1="60" y1="44" x2="60" y2="98" stroke="#4C8A4D" stroke-width="2"/>
  <line x1="72" y1="42" x2="72" y2="98" stroke="#4C8A4D" stroke-width="2"/>
  <!-- side chute -->
